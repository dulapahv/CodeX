# GitHub Actions CI/CD pipeline.
# Features:
# - Server unit tests (Jest) and client E2E tests (Playwright)
# - Builds and deploys the client to Cloudflare Workers only after tests pass
# - Triggers the Render deploy hook for the server
#
# By Dulapah Vibulsanti (https://dulapahv.dev)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'packages/**'
              - '.github/workflows/ci.yml'
            client:
              - *shared
              - 'apps/client/**'
            server:
              - *shared
              - 'apps/server/**'

  test-server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-server-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-server-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server
        run: pnpm build:server

      - name: Run Jest tests
        run: pnpm test:server

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-report
          path: apps/server/test-results/junit.xml
          retention-days: 30

  test-client:
    name: Client E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Scoped to this job on purpose. It is inlined into the browser bundle and
      # makes instrumentation-client.ts skip Sentry.init, keeping test runs out of
      # the production Sentry project. It must NEVER be set for the deploy build -
      # that would ship a production bundle with Sentry silently disabled.
      NEXT_PUBLIC_CI: 'true'
      BETTERSTACK_API_KEY: ${{ secrets.BETTERSTACK_API_KEY }}
      PISTON_API_KEY: ${{ secrets.PISTON_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-client-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-client-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/client/.next/cache
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter client exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter client exec playwright install-deps chromium

      - name: Run Playwright tests
        run: pnpm test:client

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/client/playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: apps/client/test-results/
          retention-days: 30

  deploy-client:
    name: Deploy client to Cloudflare
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.client == 'true'
    needs: [changes, test-server, test-client]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the Node version the Cloudflare Workers Builds image used, so
          # the artifact this pipeline ships is built the same way it always was.
          node-version: 24
          cache: 'pnpm'

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/client/.next/cache
          key: ${{ runner.os }}-nextjs-deploy-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-deploy-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @codex/types is consumed as TypeScript source (bundler resolution +
      # experimental.externalDir), so no workspace pre-build is needed here.
      - name: Build application
        working-directory: apps/client
        run: pnpm exec opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          # Without this the Sentry bundler plugin generates source maps, then
          # deletes them without uploading, and production stack traces stay minified.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Ties uploaded source maps to the commit that produced them. Replaces the
          # WORKERS_CI_COMMIT_SHA that Workers Builds used to inject.
          SENTRY_RELEASE: ${{ github.sha }}

      - name: Deploy to Cloudflare
        working-directory: apps/client
        run: pnpm exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-server:
    name: Deploy server to Render
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.server == 'true'
    needs: [changes, test-server, test-client]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.SERVER_DEPLOY_HOOK }}"
